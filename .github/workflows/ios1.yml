name: Build and Wrap to IPA

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1

      - name: Compile Package (.deb)
        run: make package

      - name: Convert DEB to IPA Structure
        run: |
          mkdir -p Payload
          dpkg-deb -x packages/*.deb extracted_deb
          
          mkdir -p Payload/FreeFireHackDemo.app
          cp extracted_deb/Library/MobileSubstrate/DynamicLibraries/FreeFireHackDemo.dylib Payload/FreeFireHackDemo.app/
          
          cat << 'EOF' > Payload/FreeFireHackDemo.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.demo.hack.ipa</string>
              <key>CFBundleName</key>
              <string>FreeFireHackDemo</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>FreeFireHackDemo</string>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF
          
          zip -r FreeFireHackDemo.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireHackDemo-IPA
          path: FreeFireHackDemo.ipa
