name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Default Scheme
        env:
          # Optional: set WORKSPACE_PATH to the directory that contains your Xcode project/workspace (e.g. ios)
          WORKSPACE_PATH: "${{ env.WORKSPACE_PATH }}"
        run: |
          set -euo pipefail

          search_path="${WORKSPACE_PATH:-.}"
          echo "Searching for .xcworkspace or .xcodeproj under: $search_path"

          # Try to find the first workspace or project under the search path (limit depth to avoid long scans)
          file=$(find "$search_path" -maxdepth 5 -type d \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) -print -quit || true)

          # If none found, check if Podfile exists (common case: workspace is generated by CocoaPods). If so, run pod install and search again.
          if [ -z "$file" ]; then
            podfile_dir=$(find "$search_path" -maxdepth 6 -type f -name Podfile -print -quit || true)
            if [ -n "$podfile_dir" ]; then
              podfile_dir=$(dirname "$podfile_dir")
              echo "Found Podfile in $podfile_dir — running pod install"
              # Install CocoaPods if not available (best-effort)
              if ! command -v pod >/dev/null 2>&1; then
                echo "Installing CocoaPods"
                sudo gem install cocoapods --no-document || true
              fi
              pushd "$podfile_dir" >/dev/null
              pod install --repo-update || true
              popd >/dev/null

              # search again after pod install
              file=$(find "$search_path" -maxdepth 5 -type d \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) -print -quit || true)
            fi
          fi

          if [ -z "$file" ]; then
            echo "::error ::No Xcode .xcworkspace or .xcodeproj found under $search_path. Place your workspace/project in the repo or set WORKSPACE_PATH in the workflow to the correct directory."
            # List top-level files to help debugging
            echo "Repository root listing:"
            ls -la
            exit 1
          fi

          if [[ "$file" == *.xcworkspace ]]; then
            echo "Found workspace: $file"
            scheme_list=$(xcodebuild -list -workspace "$file" -json 2>/dev/null || true)
            filetype_parameter="workspace"
            file_to_build="$file"
          else
            echo "Found project: $file"
            scheme_list=$(xcodebuild -list -project "$file" -json 2>/dev/null || true)
            filetype_parameter="project"
            file_to_build="$file"
          fi

          # If xcodebuild returned empty output, attempt one more time (sometimes requires the workspace to be generated first)
          if [ -z "$scheme_list" ]; then
            echo "xcodebuild returned empty output. Attempting to regenerate workspace (if Podfile exists) and retry."
            podfile_dir=$(find "$search_path" -maxdepth 6 -type f -name Podfile -print -quit || true)
            if [ -n "$podfile_dir" ]; then
              podfile_dir=$(dirname "$podfile_dir")
              pushd "$podfile_dir" >/dev/null
              pod install --repo-update || true
              popd >/dev/null

              if [[ "$filetype_parameter" == "workspace" ]]; then
                scheme_list=$(xcodebuild -list -workspace "$file_to_build" -json 2>/dev/null || true)
              else
                scheme_list=$(xcodebuild -list -project "$file_to_build" -json 2>/dev/null || true)
              fi
            fi
          fi

          # Ensure we have JSON output to parse
          if [ -z "$scheme_list" ]; then
            echo "::error ::xcodebuild returned empty output; cannot determine schemes/targets."
            echo "Full xcodebuild -list output (if any):"
            echo "$scheme_list"
            exit 1
          fi

          # Parse full STDIN in Ruby (avoid gets which may be empty)
          default=$(echo "$scheme_list" | ruby -e "require 'json'; j = JSON.parse(STDIN.read); puts (j['project'] && j['project']['targets'] && j['project']['targets'][0]) || (j['project'] && j['project']['schemes'] && j['project']['schemes'][0])")
          if [ -z "$default" ]; then
            echo "::error ::Could not determine default scheme/target from xcodebuild output. Full xcodebuild -list JSON:"
            echo "$scheme_list"
            exit 1
          fi

          echo "$default" > default
          echo "Using default scheme: $default"
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_ENV
          echo "file_to_build=$file_to_build" >> $GITHUB_ENV

      - name: Build
        env:
          platform: "iOS Simulator"
        run: |
          # xcrun xctrace returns via stderr
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e 's/ Simulator$//')
          scheme=$(cat default)
          echo "Building scheme=$scheme filetype=$filetype_parameter file=$file_to_build device=$device"
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device"

      - name: Test
        env:
          platform: "iOS Simulator"
        run: |
          # xcrun xctrace returns via stderr
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e 's/ Simulator$//')
          scheme=$(cat default)
          echo "Testing scheme=$scheme filetype=$filetype_parameter file=$file_to_build device=$device"
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device"
